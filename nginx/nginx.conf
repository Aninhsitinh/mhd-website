# ==============================================================================
# MHD Valuation - Production Nginx Configuration (HTTP/2 & Compression)
# ==============================================================================

# 1. Gzip Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    font/woff
    font/woff2
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# 2. Upstream Backend Definitions
upstream nuxt_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream payload_cms {
    server 127.0.0.1:3001;
    keepalive 32;
}

# 3. HTTP Server (Redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name mhdvaluation.com.vn www.mhdvaluation.com.vn cms.mhdvaluation.com.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS Frontend Server (HTTP/2 Enabled)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mhdvaluation.com.vn www.mhdvaluation.com.vn;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/mhdvaluation.com.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mhdvaluation.com.vn/privkey.pem;

    # Modern SSL Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Long-term Caching
    location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|webp|png|jpg|jpeg|gif)$ {
        proxy_pass http://nuxt_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Nuxt SSR & API proxy
    location / {
        proxy_pass http://nuxt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 5. HTTPS CMS Server (HTTP/2 Enabled)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.mhdvaluation.com.vn;

    # SSL Certificates
    # ssl_certificate /etc/letsencrypt/live/mhdvaluation.com.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mhdvaluation.com.vn/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://payload_cms;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
