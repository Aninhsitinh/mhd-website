services:
  # 1. PostgreSQL Database for Payload CMS
  postgres:
    image: postgres:16-alpine
    container_name: mhd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Bobom1234@}
      POSTGRES_DB: ${POSTGRES_DB:-mhd_cms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mhd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mhd_cms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Payload CMS 3.0 (Backend / API / Admin)
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: mhd_cms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Bobom1234@}@postgres:5432/${POSTGRES_DB:-mhd_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-mhd-payload-secret-change-in-production-2024}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
      NODE_ENV: production
    volumes:
      - cms_media:/app/media
    ports:
      - "3001:3001"
    networks:
      - mhd_network

  # 3. Nuxt 3 (Frontend / Website)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mhd_frontend
    restart: unless-stopped
    depends_on:
      - cms
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PAYLOAD_API_URL: http://cms:3001/api
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    networks:
      - mhd_network

networks:
  mhd_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  cms_media:
    driver: local
